/* ══ 문항 ══ */
function swapIn(stage, body){
  stage.classList.add('qswap');
  const out=stage.querySelector('.qbody');
  if(out&&!RM){out.classList.remove('enter');out.classList.add('leave');
    requestAnimationFrame(()=>{out.style.opacity='0';out.style.transform='translateY(-12px)';});
    setTimeout(()=>out.remove(),260);}
  else if(out)out.remove();
  stage.appendChild(body);
}

  document.querySelectorAll('#qSegs .sg').forEach((sg,ci)=>{
    const [cur,k]=CHAT[qi];
    const w=ci<cur?100:ci>cur?0:(k/CHAP[ci][1])*100;
    sg.querySelector('i').style.width=w+'%';
    sg.classList.toggle('on',ci===cur); sg.classList.toggle('done',ci<cur);
  });
  const s=QS[qi];
  const log=ans.slice(0,qi).map((v,i)=>v==null?'':`<div class="lg">${QS[i].o[v][0]}</div>`).filter(Boolean).join('');
  const body=document.createElement('div');
  body.className='qbody enter';
  body.innerHTML=`${log?`<div class="qlog">${log}</div>`:''}
    <h1 class="q">${s.q}</h1>
    <div class="opts">${s.o.map((o,i)=>`<button class="opt${ans[qi]===i?' on':''}" data-i="${i}" type="button">
      <span>${o[0]}</span><span class="ck">${IC.check(22)}</span><span class="bg">선택</span></button>`).join('')}</div>
    ${QHINT[qi]?`<p class="qhint">${QHINT[qi]}</p>`:''}

/* ══ 입력 검증 — 빚탈길과 같은 규칙 ══ */
const PHONE_RE=/^(?:010\d{8}|01[16789]\d{7,8})$/;
function fakePhone(d){
  const body=d.slice(3);
  if(/^(\d)\1+$/.test(body))            return '없는 번호예요. 실제 번호를 입력해 주세요';
  if(/^(\d{4})\1$/.test(body))          return '없는 번호예요. 실제 번호를 입력해 주세요';
  const seq='0123456789', rev='9876543210';
  if(seq.includes(body)||rev.includes(body)) return '없는 번호예요. 실제 번호를 입력해 주세요';
  return '';
}
const NAME_RE=/^(?:[가-힣]{2,}|[A-Za-z][A-Za-z\s.]{1,})$/;
const fmtPhone=v=>{const d=digits(v).slice(0,11);
  if(d.length<4)return d;
  if(d.length<8)return d.slice(0,3)+'-'+d.slice(3);
  return d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(d.length-4);};
function fieldMsg(input,text){
  const box=input.closest('.fi'); if(!box)return;
  let m=box.querySelector('.msg');
  if(!m){m=el('<p class="msg"></p>'); box.appendChild(m);}
  m.textContent=text||'';
  box.classList.toggle('bad',!!text);
  box.classList.toggle('ok',!text&&!!input.value.trim());
}
function wireForm(form){
  const n=form.querySelector('[name=name]'), t=form.querySelector('[name=phone]'),
        a=form.querySelector('[name=agree]'), btn=form.querySelector('button[type=submit]');
  const okName=()=>NAME_RE.test((n.value||'').trim());
  const phoneMsg=()=>{const d=digits(t.value);
    if(!PHONE_RE.test(d))return '휴대폰 번호 11자리를 확인해 주세요';
    return fakePhone(d);};
  const okPhone=()=>phoneMsg()==='';
  const sync=()=>{ if(btn) btn.disabled=!(okName()&&okPhone()&&a.checked); };
  n.addEventListener('input',()=>{ if(n.closest('.fi').classList.contains('bad'))
    fieldMsg(n, okName()?'':'이름을 정확히 입력해 주세요'); sync(); });
  n.addEventListener('blur',()=>{ if(n.value.trim())
    fieldMsg(n, okName()?'':'이름을 정확히 입력해 주세요'); });
  t.addEventListener('input',()=>{
    const pos=t.selectionStart===t.value.length;
    t.value=fmtPhone(t.value);
    if(pos)t.setSelectionRange(t.value.length,t.value.length);
    if(t.closest('.fi').classList.contains('bad')||digits(t.value).length>=11)
      fieldMsg(t, phoneMsg());
    sync(); });
  t.addEventListener('blur',()=>{ if(t.value.trim()) fieldMsg(t, phoneMsg()); });
  a.addEventListener('change',()=>{ a.closest('.agree').classList.toggle('bad',!a.checked); sync(); });
  sync();
  return ()=>{
    let ok=true;
    if(!okName()){fieldMsg(n,'이름을 정확히 입력해 주세요');ok=false;}
    if(!okPhone()){fieldMsg(t,phoneMsg());ok=false;}
    if(!a.checked){a.closest('.agree').classList.add('bad');ok=false;}
    if(!ok)(form.querySelector('.fi.bad input')||a).focus();
    return ok;
  };
}

/* ══ 접수 — 성공했을 때만 완료 화면으로 보낸다 ══
   실패했는데 접수됐다고 말하면 오지 않을 전화를 기다리게 된다 */
function recentlySent(phone){
  try{
    const k='hy_lp_sent_'+phone, last=+(localStorage.getItem(k)||0);
    if(Date.now()-last < 60*1000) return true;
    localStorage.setItem(k, String(Date.now()));
  }catch(e){}
  return false;
}
async function submitLead(form, payload){
  const btn=form.querySelector('button[type=submit]');
  const label=btn.textContent;
  let err=form.querySelector('.formerr');
  if(!err){ err=el('<p class="formerr fine" role="alert" style="text-align:left"></p>'); form.appendChild(err); }
  err.textContent='';
  if(recentlySent(payload.phone)){ markSent(); goDone(); return; }
  btn.disabled=true; btn.textContent='보내는 중…';
  try{
    const r=await fetch('/api/consult',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...payload, elapsed:Date.now()-PAGE_AT})});
    if(!r.ok) throw new Error('consult '+r.status);
    markSent(); goDone();
  }catch(e){
    try{localStorage.removeItem('hy_lp_sent_'+payload.phone);}catch(_){}
    btn.disabled=false; btn.textContent=label;
    err.textContent='전송에 실패했어요. 잠시 후 다시 시도하시거나 '+TEL+' 로 전화 주세요.';
    err.style.color='var(--warn)';
    console.error('lead submit failed:', e.message);
  }
}
function markSent(){try{sessionStorage.setItem('hy_lp_sent','1')}catch(e){}}
/* 접수 성공 → /상담완료 로 이동. 해시(#/done)는 스마트로그가 못 보기 때문에 주소를 바꾼다 */
function goDone(){
  try{sessionStorage.setItem('hy_done','1')}catch(e){}
  location.href='/상담완료/?from=apply';
}

/* ══ 히어로 자동 재생 ══
   두 문항을 스스로 풀고 접수 장면으로 끝난다. 아무 선택지나 누르면 즉시 멈추고
   그 답이 1번 문항의 답이 되어 문항은 2번부터 시작한다 */
const HERO_ANS=[1,0];
function initHeroDemo(){
  const card=document.getElementById('hq1'); if(!card)return;
  const opts=[...card.querySelectorAll('.q1o')];
  const $=id=>document.getElementById(id);
  let timers=[], live=true, running=false, curQ=0;
  const gone=()=>!card.isConnected;
  const clear=()=>{timers.forEach(clearTimeout);timers=[];};
  const at=(ms,fn)=>timers.push(setTimeout(()=>{
    if(gone()){live=false;running=false;clear();return;}
    fn();
  },ms));
  const showQ=qi=>{
    curQ=qi;
    $('hStep').textContent=(qi+1)+' / 3';
    $('hQz').innerHTML=QS[qi].q;
    opts.forEach((o,i)=>{ const t=QS[qi].o[i];
      o.hidden=!t; o.classList.remove('on');
      if(t)o.querySelector('.lb').textContent=t[0]; });
  };
  const scene=(inEl,outEl)=>{inEl.className='hscn in';outEl.className='hscn out';};
  const finish=()=>{ $('hHd').textContent='접수'; $('hStep').textContent='3 / 3'; scene($('hR'),$('hQ')); };
  const takeOver=i=>{
    if(!live)return;
    live=false; running=false; clear();
    const q=curQ;
    opts.forEach(o=>o.classList.remove('on'));
    opts[i]&&opts[i].classList.add('on');
    if(q===0){ try{sessionStorage.setItem('hy_lp_q0',String(i));}catch(e){} }
    setTimeout(()=>go('#/q'),280);
  };
  opts.forEach((o,i)=>o.addEventListener('click',()=>takeOver(i)));
  const STEP=RM?2600:1900, LEAD=RM?500:800, HOLD=RM?5200:3400;
  function run(){
    if(!live)return;
    running=true; clear();
    $('hHd').textContent='상담 신청';
    scene($('hQ'),$('hR'));
    showQ(0);                               /* 첫 문항은 즉시 — 빈 상자가 먼저 보이면 안 된다 */
    let t=LEAD;
    HERO_ANS.forEach((pick,qi)=>{
      if(qi>0)at(t,()=>showQ(qi));
      at(t+Math.round(STEP*.49),()=>{opts[pick]&&opts[pick].classList.add('on');});
      t+=STEP;
    });
    at(t+120,finish);
    at(t+HOLD,run);
  }
  run();
  document.addEventListener('visibilitychange',()=>{
    if(!live)return;
    if(document.hidden){running=false;clear();}
    else if(!running)run();
  });
}

/* ══ 라우터 ══ */
function go(h){ if(location.hash===h)render(); else location.hash=h; }
function render(){
  const key=(location.hash||'#/').replace('#','')||'/';
  const m=document.getElementById('main');
  const flow=key==='/q'||key==='/done';
  document.getElementById('nav').style.display=flow?'none':'';
  if(key==='/q'){
    m.innerHTML=R.q();
    qi=0; ans.length=0; onContact=false;
    const h=(()=>{try{return sessionStorage.getItem('hy_lp_q0')}catch(e){return null}})();
    if(h!==null&&QS[0].o[+h]){ans[0]=+h;qi=1;}
    try{sessionStorage.removeItem('hy_lp_q0');}catch(e){}
    renderQ();
    document.getElementById('qBack').onclick=()=>{
      if(onContact){renderQ();}
      else if(qi===0)go('#/');
      else {qi--;renderQ();}};
  }else if(key==='/done'){
    /* 접수하지 않고 주소로 들어오면 홈으로 — 완료 화면이 접수 증거처럼 읽히면 안 된다 */
    if(!SENT()){ location.replace('#/'); return; }
    m.innerHTML=R.done();
  }else{
    m.innerHTML=R.home();
    initHeroDemo();
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
